<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORWAR</title>
<style>
:root{--red:#ff334f;--cyan:#39e7ff;--panel:rgba(7,10,18,.82)}
*{box-sizing:border-box} body{margin:0;overflow:hidden;background:#05070c;color:#fff;font-family:Arial,Helvetica,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
.top{position:absolute;top:20px;left:22px;right:22px;display:flex;justify-content:space-between;gap:20px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 6px #000}
.stat{background:var(--panel);border:1px solid rgba(255,255,255,.12);padding:11px 15px;border-radius:10px;backdrop-filter:blur(8px)}
#healthbar{position:absolute;left:25px;bottom:25px;width:min(330px,70vw);height:22px;background:#1b2029;border:1px solid #555;border-radius:8px;overflow:hidden}
#healthfill{height:100%;width:100%;background:linear-gradient(90deg,#ff334f,#ff8844);transition:width .2s}
#ammo{position:absolute;right:28px;bottom:28px;font-size:36px;font-weight:900;text-shadow:0 2px 8px #000}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;text-shadow:0 0 8px #fff}
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(circle at 50% 30%,rgba(28,45,80,.78),rgba(2,3,7,.96) 65%)}
.panel{max-width:720px;padding:45px 35px;border:1px solid rgba(255,255,255,.14);background:rgba(8,11,19,.72);box-shadow:0 30px 100px #000;border-radius:20px}
.logo{font-size:clamp(64px,13vw,130px);font-weight:1000;font-style:italic;letter-spacing:8px;margin:0;background:linear-gradient(180deg,#fff,#8ba6c9);color:transparent;background-clip:text}
.tag{color:var(--cyan);font-weight:800;letter-spacing:4px;margin:8px 0 28px}
button{border:0;border-radius:10px;background:linear-gradient(135deg,#ff2b45,#a80d23);color:white;padding:16px 38px;margin:8px;font-weight:900;font-size:17px;letter-spacing:1px;cursor:pointer;box-shadow:0 10px 25px rgba(255,30,60,.25)}
button:hover{transform:translateY(-2px);filter:brightness(1.15)}
.small{color:#aab3c5;line-height:1.7}.hidden{display:none!important}
#message{position:absolute;top:18%;left:50%;transform:translateX(-50%);font-size:clamp(20px,4vw,42px);font-weight:900;letter-spacing:3px;text-shadow:0 3px 10px #000;opacity:0;transition:opacity .4s}
#damage{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 45%,rgba(255,0,30,.5));opacity:0;transition:opacity .12s;z-index:6}
@media(max-width:700px){#ammo{font-size:25px}.top{top:10px;left:10px;right:10px}.stat{padding:8px;font-size:12px}}
</style>
</head>
<body>
<div id="hud">
  <div class="top"><div class="stat">FORWAR // WAVE <span id="wave">1</span></div><div class="stat">SCORE <span id="score">0</span></div><div class="stat">KILLS <span id="kills">0</span></div></div>
  <div id="message"></div><div id="crosshair">+</div>
  <div id="healthbar"><div id="healthfill"></div></div>
  <div id="ammo"><span id="ammoNow">30</span> / <span id="ammoReserve">120</span></div>
</div>
<div id="damage"></div>
<div class="screen" id="menu"><div class="panel">
  <h1 class="logo">FORWAR</h1><div class="tag">SURVIVE • FIGHT • CONQUER</div>
  <p>Enter a ruined city. Survive escalating enemy waves and defeat the war boss.</p>
  <button id="start">START MISSION</button>
  <p class="small">WASD — Move &nbsp; | &nbsp; Mouse — Aim &nbsp; | &nbsp; Click — Fire &nbsp; | &nbsp; R — Reload<br>ESC unlocks the mouse.</p>
</div></div>
<div class="screen hidden" id="over"><div class="panel">
<h2 style="font-size:46px;margin:0;color:#ff4b5f">MISSION FAILED</h2>
<p>Your score: <b id="final">0</b></p><p>Best score: <b id="best">0</b></p>
<button onclick="location.reload()">PLAY AGAIN</button></div></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { PointerLockControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";

let scene,camera,renderer,controls,clock;
let enemies=[],tracers=[],particles=[],running=false;
let health=100,score=0,kills=0,wave=1,ammo=30,reserve=120,reloading=false,nextSpawn=0;
const keys={}; const raycaster=new THREE.Raycaster();
const ui=id=>document.getElementById(id);
const msg=ui("message");

function init(){
 scene=new THREE.Scene(); scene.background=new THREE.Color(0x08101b); scene.fog=new THREE.Fog(0x08101b,18,115);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,300); camera.position.set(0,1.75,16);
 renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; document.body.appendChild(renderer.domElement);
 controls=new PointerLockControls(camera,document.body);
 scene.add(new THREE.HemisphereLight(0x9fc9ff,0x111820,2.2));
 const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(18,35,10);sun.castShadow=true;scene.add(sun);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),new THREE.MeshStandardMaterial({color:0x151a1d,roughness:.95}));
 ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
 const grid=new THREE.GridHelper(220,60,0x263447,0x1b2632);grid.position.y=.01;scene.add(grid);
 makeCity(); makeWeapon(); clock=new THREE.Clock();
 addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 addEventListener("keydown",e=>{keys[e.code]=true;if(e.code==="KeyR")reload()});addEventListener("keyup",e=>keys[e.code]=false);
 addEventListener("mousedown",fire);
 animate();
}
function makeCity(){
 const mats=[0x242a31,0x31343b,0x1c2228];
 for(let i=0;i<70;i++){let w=3+Math.random()*7,h=5+Math.random()*24,d=3+Math.random()*7;
 let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:mats[i%3],roughness:.9,metalness:.1}));
 let a=Math.random()*Math.PI*2,r=25+Math.random()*80;m.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);m.castShadow=m.receiveShadow=true;scene.add(m)}
}
function makeWeapon(){
 const gun=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(.22,.18,.65),new THREE.MeshStandardMaterial({color:0x11151b,metalness:.8,roughness:.3}));
 body.position.set(.42,-.32,-.65);gun.add(body);
 const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.45,10),new THREE.MeshStandardMaterial({color:0x303844,metalness:1}));
 barrel.rotation.x=Math.PI/2;barrel.position.set(.42,-.27,-.98);gun.add(barrel);camera.add(gun);scene.add(camera);
}
function spawnEnemy(boss=false){
 const g=new THREE.Group(); const mat=new THREE.MeshStandardMaterial({color:boss?0x9c1838:0x6f8a5b,roughness:.75});
 const scale=boss?2.2:1;
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.34*scale,.9*scale,6,10),mat);body.position.y=.95*scale;body.castShadow=true;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.28*scale,14,10),new THREE.MeshStandardMaterial({color:boss?0xff5a5a:0x9aae77}));head.position.y=1.7*scale;g.add(head);
 const a=Math.random()*Math.PI*2,r=35+Math.random()*25;g.position.set(camera.position.x+Math.cos(a)*r,0,camera.position.z+Math.sin(a)*r);scene.add(g);
 enemies.push({mesh:g,hp:boss?32:3,speed:boss?2.0:1.2+Math.random()*.8,boss,hit:0});
}
function fire(){
 if(!running||!controls.isLocked||reloading)return;if(ammo<=0){reload();return}ammo--;updateUI();
 const origin=camera.getWorldPosition(new THREE.Vector3());const dir=new THREE.Vector3();camera.getWorldDirection(dir);
 const flash=new THREE.PointLight(0xffbb66,8,5);flash.position.copy(origin).add(dir.clone().multiplyScalar(.8));scene.add(flash);setTimeout(()=>scene.remove(flash),35);
 raycaster.set(origin,dir);const hits=raycaster.intersectObjects(enemies.map(e=>e.mesh),true);
 if(hits.length){let root=hits[0].object;while(root.parent&&root.parent.type!=="Scene")root=root.parent;let e=enemies.find(x=>x.mesh===root);if(e){e.hp--;e.hit=.12;if(e.hp<=0)kill(e)}}
 const geo=new THREE.BufferGeometry().setFromPoints([origin,origin.clone().add(dir.multiplyScalar(30))]);const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffee88}));scene.add(line);setTimeout(()=>{scene.remove(line);geo.dispose()},45);
}
function reload(){if(reloading||ammo===30||reserve<=0)return;reloading=true;show("RELOADING");setTimeout(()=>{let need=30-ammo,take=Math.min(need,reserve);ammo+=take;reserve-=take;reloading=false;updateUI();show("")},1100)}
function kill(e){scene.remove(e.mesh);enemies=enemies.filter(x=>x!==e);score+=e.boss?1000:100;kills++;updateUI();burst(e.mesh.position,e.boss?40:14);if(enemies.length===0)setTimeout(nextWave,900)}
function burst(p,n){for(let i=0;i<n;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(.04+Math.random()*.07,5,5),new THREE.MeshBasicMaterial({color:0xff5522}));m.position.copy(p);scene.add(m);particles.push({m,v:new THREE.Vector3((Math.random()-.5)*8,Math.random()*7,(Math.random()-.5)*8),life:.5+Math.random()*.7})}}
function nextWave(){wave++;reserve=Math.min(300,reserve+45);updateUI();show(wave%5===0?"BOSS INCOMING":"WAVE "+wave);let count=Math.min(4+wave*2,18);for(let i=0;i<count;i++)setTimeout(()=>spawnEnemy(false),i*350);if(wave%5===0)setTimeout(()=>spawnEnemy(true),count*350+500)}
function updateUI(){ui("wave").textContent=wave;ui("score").textContent=score;ui("kills").textContent=kills;ui("ammoNow").textContent=ammo;ui("ammoReserve").textContent=reserve;ui("healthfill").style.width=Math.max(0,health)+"%"}
function show(t){msg.textContent=t;msg.style.opacity=t?1:0}
function damage(v){health-=v;ui("damage").style.opacity=.65;setTimeout(()=>ui("damage").style.opacity=0,100);updateUI();if(health<=0)end()}
function update(dt){
 if(!running||!controls.isLocked)return;
 const speed=7,forward=(keys.KeyW?1:0)-(keys.KeyS?1:0),side=(keys.KeyD?1:0)-(keys.KeyA?1:0);
 if(forward)controls.moveForward(forward*speed*dt);if(side)controls.moveRight(side*speed*dt);camera.position.y=1.75;
 for(const e of enemies){const d=new THREE.Vector3().subVectors(camera.position,e.mesh.position);d.y=0;let dist=d.length();d.normalize();if(dist>1.4* (e.boss?1.5:1))e.mesh.position.addScaledVector(d,e.speed*dt);else damage((e.boss?22:8)*dt);e.mesh.lookAt(camera.position.x,e.mesh.position.y,camera.position.z);e.mesh.rotation.x=0;e.mesh.rotation.z=0;if(e.hit>0){e.hit-=dt;e.mesh.children.forEach(c=>c.material.emissive&&c.material.emissive.setHex(0xff0000))}}
 for(const p of particles){p.m.position.addScaledVector(p.v,dt);p.v.y-=12*dt;p.life-=dt;p.m.scale.setScalar(Math.max(0,p.life));if(p.life<=0){scene.remove(p.m);p.dead=true}}particles=particles.filter(p=>!p.dead);
 if(enemies.length===0&&performance.now()>nextSpawn){nextSpawn=performance.now()+1200;let n=wave%5===0?1:Math.min(4+wave,14);for(let i=0;i<n;i++)setTimeout(()=>spawnEnemy(wave%5===0&&i===0),i*280)}
}
function end(){running=false;controls.unlock();let best=Math.max(+localStorage.getItem("forwarBest")||0,score);localStorage.setItem("forwarBest",best);ui("final").textContent=score;ui("best").textContent=best;ui("over").classList.remove("hidden");}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);update(dt);renderer.render(scene,camera)}
ui("start").addEventListener("click", function () {

  console.log("Starting FORWAR...");

  // Hide menu
  ui("menu").classList.add("hidden");

  // Show game HUD
  ui("hud").style.display = "block";

  // Start game
  running = true;

  health = 100;
  score = 0;
  kills = 0;
  wave = 1;
  ammo = 30;
  reserve = 120;

  updateUI();

  // Lock mouse for FPS controls
  if (controls) {
    controls.lock();
  }

  show("WAVE 1");

  // Spawn enemies
  for (let i = 0; i < 5; i++) {
    setTimeout(function () {
      spawnEnemy(false);
    }, i * 500);
  }

});
init();
</script>
</body></html>
