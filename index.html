<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ULTIMATE WAR 3D</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
  }

  canvas {
    display: block;
  }

  #hud {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 18px;
    display: none;
    justify-content: space-between;
    z-index: 10;
    font-weight: bold;
    pointer-events: none;
  }

  .screen {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background:
      radial-gradient(circle, rgba(30,40,70,.8), rgba(0,0,0,.96));
  }

  .hidden {
    display: none !important;
  }

  h1 {
    font-size: clamp(45px, 9vw, 100px);
    letter-spacing: 8px;
    margin-bottom: 15px;
  }

  h2 {
    margin: 10px;
  }

  p {
    color: #ccc;
    margin: 8px;
    max-width: 600px;
  }

  button {
    padding: 15px 40px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    background: #e22;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    transform: scale(1.05);
  }

  #crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 35px;
    display: none;
    z-index: 5;
    pointer-events: none;
  }

  #mobileShoot {
    position: fixed;
    bottom: 30px;
    right: 30px;
    display: none;
    z-index: 15;
    width: 80px;
    height: 80px;
    border-radius: 50%;
  }

  @media (max-width: 700px) {
    #mobileShoot {
      display: block;
    }

    h1 {
      letter-spacing: 3px;
    }
  }
</style>
</head>

<body>

<div id="hud">
  <div>❤️ HEALTH: <span id="health">100</span></div>
  <div>🏆 SCORE: <span id="score">0</span></div>
  <div>🎯 MISSION: <span id="mission">ZOMBIE SURVIVAL</span></div>
</div>

<div id="crosshair">+</div>

<div class="screen" id="menu">
  <h1>ULTIMATE WAR 3D</h1>

  <p>
    Survive zombies. Drive into combat. Fight enemy soldiers.
    Take the final battle into space.
  </p>

  <button id="playButton">START GAME</button>

  <p>
    WASD = Move<br>
    Mouse = Look<br>
    Click = Shoot
  </p>
</div>

<div class="screen hidden" id="gameOver">
  <h1>MISSION FAILED</h1>
  <h2>Score: <span id="finalScore">0</span></h2>
  <button onclick="location.reload()">PLAY AGAIN</button>
</div>

<button id="mobileShoot">FIRE</button>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

let scene;
let camera;
let renderer;

let zombies = [];
let bullets = [];

let health = 100;
let score = 0;

let gameRunning = false;

let moveForward = false;
let moveBackward = false;
let moveLeft = false;
let moveRight = false;

let yaw = 0;
let pitch = 0;

const velocity = new THREE.Vector3();

const hud = document.getElementById("hud");
const menu = document.getElementById("menu");
const crosshair = document.getElementById("crosshair");

const healthEl = document.getElementById("health");
const scoreEl = document.getElementById("score");

const clock = new THREE.Clock();

/* ---------- CREATE GAME ---------- */

function init() {

  scene = new THREE.Scene();

  scene.background = new THREE.Color(0x101820);

  scene.fog = new THREE.Fog(0x101820, 15, 80);

  camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  camera.position.set(0, 2, 10);

  renderer = new THREE.WebGLRenderer({
    antialias: true
  });

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
  );

  document.body.appendChild(renderer.domElement);

  /* LIGHT */

  const light = new THREE.HemisphereLight(
    0xffffff,
    0x222222,
    2
  );

  scene.add(light);

  const directional = new THREE.DirectionalLight(
    0xffffff,
    2
  );

  directional.position.set(10, 20, 10);

  scene.add(directional);

  /* GROUND */

  const groundGeometry =
    new THREE.PlaneGeometry(200, 200);

  const groundMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x202020
    });

  const ground =
    new THREE.Mesh(
      groundGeometry,
      groundMaterial
    );

  ground.rotation.x = -Math.PI / 2;

  scene.add(ground);

  /* ENVIRONMENT */

  for (let i = 0; i < 40; i++) {

    const building =
      new THREE.Mesh(

        new THREE.BoxGeometry(
          3 + Math.random() * 5,
          5 + Math.random() * 15,
          3 + Math.random() * 5
        ),

        new THREE.MeshStandardMaterial({
          color: 0x333333
        })

      );

    building.position.set(
      (Math.random() - 0.5) * 150,
      building.geometry.parameters.height / 2,
      (Math.random() - 0.5) * 150
    );

    scene.add(building);

  }

  createZombies(12);

  window.addEventListener(
    "resize",
    onResize
  );

  document.addEventListener(
    "keydown",
    keyDown
  );

  document.addEventListener(
    "keyup",
    keyUp
  );

  document.addEventListener(
    "mousemove",
    mouseMove
  );

  document.addEventListener(
    "click",
    shoot
  );

  document
    .getElementById("mobileShoot")
    .addEventListener("click", shoot);

  animate();

}

/* ---------- ZOMBIES ---------- */

function createZombies(amount) {

  for (let i = 0; i < amount; i++) {

    const group = new THREE.Group();

    const body =
      new THREE.Mesh(

        new THREE.BoxGeometry(
          1,
          2,
          0.7
        ),

        new THREE.MeshStandardMaterial({
          color: 0x2f8f3a
        })

      );

    body.position.y = 1;

    const head =
      new THREE.Mesh(

        new THREE.SphereGeometry(
          0.45,
          16,
          16
        ),

        new THREE.MeshStandardMaterial({
          color: 0x88aa66
        })

      );

    head.position.y = 2.3;

    group.add(body);
    group.add(head);

    const angle = Math.random() * Math.PI * 2;
    const distance = 15 + Math.random() * 25;

    group.position.set(
      Math.cos(angle) * distance,
      0,
      Math.sin(angle) * distance
    );

    scene.add(group);

    zombies.push({
      mesh: group,
      health: 3,
      speed: 0.8 + Math.random() * 0.5
    });

  }

}

/* ---------- SHOOT ---------- */

function shoot() {

  if (!gameRunning) return;

  const geometry =
    new THREE.SphereGeometry(
      0.12,
      8,
      8
    );

  const material =
    new THREE.MeshBasicMaterial({
      color: 0xffff00
    });

  const bullet =
    new THREE.Mesh(
      geometry,
      material
    );

  bullet.position.copy(
    camera.position
  );

  const direction =
    new THREE.Vector3();

  camera.getWorldDirection(
    direction
  );

  bullets.push({
    mesh: bullet,
    direction
  });

  scene.add(bullet);

}

/* ---------- UPDATE ---------- */

function update(delta) {

  if (!gameRunning) return;

  velocity.set(0, 0, 0);

  const speed = 8;

  if (moveForward) velocity.z -= speed;
  if (moveBackward) velocity.z += speed;
  if (moveLeft) velocity.x -= speed;
  if (moveRight) velocity.x += speed;

  velocity.applyAxisAngle(
    new THREE.Vector3(0, 1, 0),
    yaw
  );

  camera.position.addScaledVector(
    velocity,
    delta
  );

  camera.rotation.set(
    pitch,
    yaw,
    0,
    "YXZ"
  );

  /* BULLETS */

  bullets.forEach(bullet => {

    bullet.mesh.position.addScaledVector(
      bullet.direction,
      40 * delta
    );

    zombies.forEach(zombie => {

      const distance =
        bullet.mesh.position.distanceTo(
          zombie.mesh.position
        );

      if (distance < 1.5) {

        zombie.health--;

        scene.remove(
          bullet.mesh
        );

        bullet.dead = true;

        if (zombie.health <= 0) {

          scene.remove(
            zombie.mesh
          );

          zombie.dead = true;

          score += 100;

          scoreEl.textContent = score;

        }

      }

    });

  });

  bullets = bullets.filter(
    bullet => !bullet.dead
  );

  zombies = zombies.filter(
    zombie => !zombie.dead
  );

  /* ZOMBIE AI */

  zombies.forEach(zombie => {

    const direction =
      new THREE.Vector3()
      .subVectors(
        camera.position,
        zombie.mesh.position
      );

    direction.y = 0;

    const distance =
      direction.length();

    direction.normalize();

    if (distance > 1.8) {

      zombie.mesh.position.addScaledVector(
        direction,
        zombie.speed * delta
      );

      zombie.mesh.lookAt(
        camera.position.x,
        zombie.mesh.position.y,
        camera.position.z
      );

    } else {

      health -= 12 * delta;

      healthEl.textContent =
        Math.max(
          0,
          Math.floor(health)
        );

      if (health <= 0) {

        endGame();

      }

    }

  });

  /* NEXT MISSION */

  if (
    zombies.length === 0 &&
    gameRunning
  ) {

    document
      .getElementById("mission")
      .textContent =
      "MISSION COMPLETE";

  }

}

/* ---------- ANIMATION ---------- */

function animate() {

  requestAnimationFrame(animate);

  const delta = Math.min(
    clock.getDelta(),
    0.1
  );

  update(delta);

  renderer.render(
    scene,
    camera
  );

}

/* ---------- CONTROLS ---------- */

function keyDown(event) {

  if (event.code === "KeyW") moveForward = true;
  if (event.code === "KeyS") moveBackward = true;
  if (event.code === "KeyA") moveLeft = true;
  if (event.code === "KeyD") moveRight = true;

}

function keyUp(event) {

  if (event.code === "KeyW") moveForward = false;
  if (event.code === "KeyS") moveBackward = false;
  if (event.code === "KeyA") moveLeft = false;
  if (event.code === "KeyD") moveRight = false;

}

function mouseMove(event) {

  if (!gameRunning) return;

  yaw -= event.movementX * 0.002;

  pitch -= event.movementY * 0.002;

  pitch = Math.max(
    -1.4,
    Math.min(
      1.4,
      pitch
    )
  );

}

/* ---------- START ---------- */

document
  .getElementById("playButton")
  .addEventListener("click", () => {

    menu.classList.add("hidden");

    hud.style.display = "flex";

    crosshair.style.display = "block";

    gameRunning = true;

    renderer.domElement.requestPointerLock();

  });

/* ---------- GAME OVER ---------- */

function endGame() {

  gameRunning = false;

  document.exitPointerLock();

  document
    .getElementById("finalScore")
    .textContent = score;

  document
    .getElementById("gameOver")
    .classList.remove("hidden");

}

/* ---------- RESIZE ---------- */

function onResize() {

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

}

/* ---------- INITIALIZE ---------- */

init();

</script>

</body>
</html>
